[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "warpalign"
version = "3.0.0"
description = "The WarpTransformer for cross-batch GC-MS retention-time alignment (an alignbench plugin)"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jesse Wood" }]
dependencies = [
    # Not on PyPI: the shared core (data, anchors, warps, baselines, metrics), pinned to a pushed
    # commit of github.com/woodRock/align-bench. warpalign 3.0 keeps only the WarpTransformer.
    "alignbench @ git+https://github.com/woodRock/align-bench.git@1717d9cabc29e6f130fb412a56e22ae1277380d5",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "matplotlib>=3.7",
    "h5py>=3.9",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "coverage>=7", "ruff>=0.5", "mypy>=1.10"]

[project.entry-points."alignbench.methods"]
warp-transformer = "warpalign.alignbench_plugin:WarpTransformer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: end-to-end runs of every pipeline step (minutes)",
    "real: needs the real fish-oil data under data/fish_oil",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["warpalign"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if torch.cuda.is_available\\(\\):",
    "if x.device.type == 'mps':",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts/archive", "notebooks", "*.md"]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E741",     # 'l' as a name in short comprehensions
    "RUF001",   # ×, −, σ etc. in strings are intended
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["warpalign"]

[tool.mypy]
python_version = "3.11"
files = ["src/warpalign"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
